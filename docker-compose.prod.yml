version: '3.8'
services:
  app-prod:
    image: task-manager:prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: always

  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin